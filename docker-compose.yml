name: creator-flow

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "7311:5432"
    environment:
      POSTGRES_USER: creator_flow
      POSTGRES_PASSWORD: creator_flow_dev
      POSTGRES_DB: creator_flow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator_flow -d creator_flow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "7312:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.0-rc.5
    restart: unless-stopped
    ports:
      - "7313:9000"
      - "7314:9001"
    environment:
      RUSTFS_ACCESS_KEY: creator_flow
      RUSTFS_SECRET_KEY: creator_flow_dev
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_VOLUMES: /data
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  redis_data:
  storage_data:
